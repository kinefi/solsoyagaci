name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# GitHub Pages için gerekli yetkiler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda birden fazla deploy çakışmasını önlemek için
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies 📥
        run: pnpm install

      - name: Build Project 🏗️
        run: pnpm build

      - name: Upload artifact 📁
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4